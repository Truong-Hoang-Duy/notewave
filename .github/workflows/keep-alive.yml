name: Keep-Alive Backend

on:
  schedule:
    # Chạy mỗi 3 ngày 1 lần lúc 02:00 UTC (09:00 sáng VN) để giữ Supabase không bị Pause (Supabase pause sau 7 ngày rảnh).
    # Để Render tự ngủ bình thường sau 15 phút nhằm tiết kiệm 750 giờ/tháng chia sẻ cho các dự án khác.
    - cron: '0 2 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend Health Endpoint
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL || vars.BACKEND_URL }}
        run: |
          URL="${BACKEND_URL:-https://notewave-api.onrender.com}"
          # Bỏ dấu / ở cuối nếu có, rồi nối với /api/health
          URL="${URL%/}"
          if [[ "$URL" != *"/api/health" ]]; then
            URL="$URL/api/health"
          fi
          echo "Sending keep-alive ping to: $URL"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -m 60 "$URL" || echo "failed")
          echo "Response HTTP status: $STATUS"
