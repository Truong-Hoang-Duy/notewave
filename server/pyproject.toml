[project]
name = "notewave-server"
version = "0.1.0"
description = "Backend API for NoteWave meeting notes and live captions"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlmodel>=0.0.22",
    "pydantic-ai>=1.0.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "python-docx>=1.1.0",
    "psycopg[binary]>=3.2",
    "mistralai>=2.10.0",
    "pypdf>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
