# Render Blueprint — deploy backend NoteWave (FastAPI) lên Render Free Web Service.
# Dashboard Render > New > Blueprint > chọn repo này. Các biến `sync: false` sẽ được hỏi khi tạo.
services:
  - type: web
    name: notewave-api
    runtime: python
    plan: free
    region: singapore # nên trùng region với Supabase project (Southeast Asia - Singapore)
    rootDir: server
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: SONIOX_API_KEY
        sync: false
      - key: DATABASE_URL # Supabase > Connect > Transaction pooler (cổng 6543, thêm ?sslmode=require)
        sync: false
      - key: ALLOWED_ORIGINS # vd: https://notewave.vercel.app
        sync: false
      - key: SUMMARY_MODEL
        value: openai:gpt-5.6-luna
      - key: OPENAI_API_KEY
        sync: false
      - key: MISTRAL_API_KEY # Mistral OCR cho tab "Quét tài liệu"
        sync: false
      - key: OCR_MODEL
        value: mistral-ocr-latest
      - key: PUBLIC_BASE_URL # vd: https://notewave-api.onrender.com (bật webhook Soniox)
        sync: false
      - key: SONIOX_WEBHOOK_SECRET
        generateValue: true
      - key: MAX_UPLOAD_MB
        value: "100"
